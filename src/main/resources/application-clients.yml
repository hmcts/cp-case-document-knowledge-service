rag:
  client:
    base-url: ${CP_CDK_RAG_URL}
    connect-timeout-ms: ${CP_CDK_RAG_CONNECTION_TIMEOUT_MS:3000}
    read-timeout-ms: ${CP_CDK_RAG_READ_TIMEOUT_MS:180000}
    auth:
      mode: ${CP_CDK_RAG_AUTH_MODE:subscription-key}    # subscription-key | aad
      subscription-key: ${CP_CDK_RAG_SUBSCRIPTION_KEY:} # used when mode=subscription-key
      aad:
        scope: ${CP_CDK_RAG_AAD_SCOPE:}                 # e.g. http://<app-id>/.default
        clientId: ${AZURE_MI_CLIENT_ID:}
        tenantId: ${AZURE_TENANT_ID:}
    headers:
      Accept: application/json
      Content-Type: application/json
cqrs:
  client:
    base-url: ${CP_CDK_BASE_URL:http://localhost:8080}
    connect-timeout-ms: ${CP_CDK_CQRS_CONNECTION_TIMEOUT_MS:3000}
    read-timeout-ms: ${CP_CDK_CQRS_READ_TIMEOUT_MS:15000}
    headers:
      cjs-cppuid: ${CP_CDK_CJSCPPUID_HEADER:CJSCPPUID}
    hearing:
      get-hearings-accept-header: "application/vnd.hearing.get.hearings+json"
      get-hearings-path: "/hearing-query-api/query/api/rest/hearing/hearings"
      get-hearing-cases-for-day-accept-header: "application/vnd.hearing.get.hearing-cases-for-day+json"
      get-hearing-cases-for-day-path: "/hearing-query-api/query/api/rest/hearing/hearing-cases-for-day"
      is-hearing-for-cases-enabled: ${CP_CDK_HEARING_IS_HEARING_FOR_CASES_ENABLED:true}
    progression:
      accept-header: "application/vnd.progression.query.courtdocuments+json"
      doc-type-id: "41be14e8-9df5-4b08-80b0-1e670bc80a5b"
      court-docs-path: "/progression-query-api/query/api/rest/progression/courtdocumentsearch"
      material-content-path: "/progression-query-api/query/api/rest/progression/material/{materialId}/content"
      accept-for-court-doc-search: "application/vnd.progression.query.courtdocuments+json"
      accept-for-material-content: "application/vnd.progression.query.material-content+json"
